# Contoh opsional; file ini tidak berada di .github/workflows dan tidak berjalan otomatis.
# Setup Claude GitHub App dan secret milik sendiri menurut dokumentasi resmi sebelum menyalin.
name: Claude review example
on: workflow_dispatch
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Read REVIEW.md and review the selected lab code. Report evidence; do not modify files."
