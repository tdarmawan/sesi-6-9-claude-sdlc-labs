<!doctype html><html lang="id"><meta charset="utf-8"><title>Ops Finance Lab</title><style>body{font:17px system-ui;max-width:760px;margin:50px auto;padding:20px;background:#f4f7fa;color:#123}input,button{font:inherit;padding:12px;display:block;margin:10px 0}button{background:#155d79;color:white;border:0;border-radius:6px}section{background:white;padding:24px;border-radius:12px}#result{white-space:pre-wrap}</style>
<h1>Klaim saya</h1><p>Data dummy · akun Rina · plafon bulanan Rp1.000.000 · data kembali kosong saat server dimulai ulang.</p><section><form id="claim-form"><label for="merchant">Merchant</label><input id="merchant" required><label for="amount">Jumlah (rupiah)</label><input id="amount" type="number" min="1" step="1" required><button>Ajukan klaim</button></form><p id="result" role="status"></p><ul id="claims"></ul></section>
<script>const output=document.querySelector('#result'),list=document.querySelector('#claims');document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const r=await fetch('/api/claims',{method:'POST',headers:{'Content-Type':'application/json','X-Lab-User':'rina'},body:JSON.stringify({merchant:document.querySelector('#merchant').value,amount:Number(document.querySelector('#amount').value)})});const data=await r.json();output.textContent=r.ok?'Klaim tersimpan. Sisa plafon: '+data.remaining:data.error+(data.remaining!==undefined?' · Sisa plafon: '+data.remaining:'');if(r.ok){const li=document.createElement('li');li.textContent=data.claim.merchant+' — '+data.claim.amount;list.append(li);}}catch{output.textContent='Koneksi gagal. Data belum dikonfirmasi tersimpan.';}finally{button.disabled=false;}});</script></html>
